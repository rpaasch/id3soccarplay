name = "id3"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# IPA + metadata storage.
[[kv_namespaces]]
binding = "STATE"
id = "335ac8e5f6c34183a6eaeea409f412a7"

[triggers]
crons = ["*/5 * * * *"]

[vars]
GH_REPO = "rpaasch/id3soccarplay"
OIDC_AUDIENCE = "id3maps-ci"
SMARTCAR_MODE = "live"

# Secrets (set with `wrangler secret put`):
#   SIGNING_BUNDLE_B64  base64 tar.gz of dist.p12 + id3.mobileprovision + p12-password.txt
#   (M1 later: SMARTCAR_CLIENT_SECRET, SMARTCAR_AMT, STATUS_TOKEN)
