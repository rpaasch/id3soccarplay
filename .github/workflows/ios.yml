name: iOS build

on:
  push:
    branches:
      - main
      - claude/apple-maps-vw-id3-ev-qf6bdn
    paths:
      - "Sources/**"
      - "Resources/**"
      - "project.yml"
      - "Config/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      sign:
        description: "Also build a signed Ad Hoc IPA and publish it"
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Always-on compile check. Validates app + extension compile under Swift 6
  # strict concurrency. No signing material needed.
  compile:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select latest stable Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ID3Maps.xcodeproj -scheme ID3Maps -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

  # Signed Ad Hoc IPA. Fetches the signing material from the ID3Maps Cloudflare
  # Worker over GitHub OIDC (no secret in the repo), builds, signs, and uploads
  # the IPA back to the Worker, which hosts the install page. Manual dispatch
  # with sign=true.
  adhoc:
    needs: compile
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign }}
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      TEAM_ID: XY6GZ256WA
      PROFILE_NAME: ID3 Ad Hoc
      APP_BUNDLE_ID: com.porsche.one
      EXT_BUNDLE_ID: com.porsche.one.extension
      WORKER: https://id3.78fvr47qyz.workers.dev
      OIDC_AUDIENCE: id3maps-ci
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch signing material (OIDC)
        run: |
          set -euo pipefail
          OIDC=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OIDC_AUDIENCE" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          mkdir -p "$RUNNER_TEMP/sign"
          code=$(curl -sS -o "$RUNNER_TEMP/sign/bundle.b64" -w "%{http_code}" \
            -H "Authorization: Bearer $OIDC" "$WORKER/ci/signing")
          if [ "$code" != "200" ]; then
            echo "::error::Worker /ci/signing returned $code"; cat "$RUNNER_TEMP/sign/bundle.b64"; exit 1
          fi
          base64 --decode "$RUNNER_TEMP/sign/bundle.b64" > "$RUNNER_TEMP/sign/bundle.tgz"
          tar -xzf "$RUNNER_TEMP/sign/bundle.tgz" -C "$RUNNER_TEMP/sign"
          ls -1 "$RUNNER_TEMP/sign"

      - name: Create keychain and import certificate
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/build.keychain-db"
          P12_PW="$(cat "$RUNNER_TEMP/sign/p12-password.txt")"
          security create-keychain -p actions "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p actions "$KC"
          security import "$RUNNER_TEMP/sign/dist.p12" -P "$P12_PW" -A -t cert -f pkcs12 -k "$KC"
          security list-keychains -d user -s "$KC" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$KC" >/dev/null
          security find-identity -v -p codesigning "$KC"

      - name: Install provisioning profile
        run: |
          set -euo pipefail
          PROF="$RUNNER_TEMP/sign/id3.mobileprovision"
          UUID="$(security cms -D -i "$PROF" | plutil -extract UUID raw -)"
          DEST="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DEST"
          cp "$PROF" "$DEST/$UUID.mobileprovision"
          echo "Installed profile $UUID"

      - name: Generate project
        run: xcodegen generate

      - name: Archive (Release, manual signing)
        run: |
          set -euo pipefail
          xcodebuild \
            -project ID3Maps.xcodeproj -scheme ID3Maps -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ID3Maps.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/build.keychain-db" \
            archive

      - name: Export Ad Hoc IPA
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>release-testing</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>$APP_BUNDLE_ID</key><string>$PROFILE_NAME</string>
              <key>$EXT_BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
            <key>compileBitcode</key><false/>
            <key>stripSwiftSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ID3Maps.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/build.keychain-db"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload IPA to Worker (OIDC)
        run: |
          set -euo pipefail
          IPA="$(ls "$RUNNER_TEMP/export"/*.ipa | head -1)"
          OIDC=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OIDC_AUDIENCE" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          resp=$(curl -sS -X POST -H "Authorization: Bearer $OIDC" \
            --data-binary @"$IPA" \
            "$WORKER/ci/upload?build=${{ github.run_number }}&version=0.1.0")
          echo "$resp"
          echo "### ✅ Build klar" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Åbn på iPhonen i Safari: <$WORKER/>" >> "$GITHUB_STEP_SUMMARY"
