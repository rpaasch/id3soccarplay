name: ID3Maps
options:
  bundleIdPrefix: com.porsche
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Release
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Manual
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Use our hand-written Info.plist / entitlements verbatim — never generate.
    GENERATE_INFOPLIST_FILE: NO
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"

targets:
  ID3Maps:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
        excludes:
          - Info.plist
          - App.entitlements
      - path: Sources/Shared
      - path: Resources/id3.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.porsche.one
        PRODUCT_NAME: ID3Maps
        INFOPLIST_FILE: Sources/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/App/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: ID3Extension
        embed: true

  ID3Extension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Extension
        excludes:
          - Info.plist
          - Extension.entitlements
      - path: Sources/Shared
      - path: Resources/id3.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.porsche.one.extension
        PRODUCT_NAME: ID3Extension
        INFOPLIST_FILE: Sources/Extension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Extension/Extension.entitlements
