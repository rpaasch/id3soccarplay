name: ID3Maps
options:
  bundleIdPrefix: com.porsche
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Release

configs:
  Debug: debug
  Release: release

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Manual
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    # Signing is injected by CI via Config/Signing.xcconfig (gitignored).
    # Locally/unsigned CI builds leave these empty and pass CODE_SIGNING_ALLOWED=NO.
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"

targets:
  ID3Maps:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
      - path: Resources/id3.json
        buildPhase: resources
    info:
      path: Sources/App/Info.plist
    entitlements:
      path: Sources/App/App.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.porsche.one
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: ID3Maps
    dependencies:
      - target: ID3Extension
        embed: true

  ID3Extension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Extension
      - path: Sources/Shared
      - path: Resources/id3.json
        buildPhase: resources
    info:
      path: Sources/Extension/Info.plist
    entitlements:
      path: Sources/Extension/Extension.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.porsche.one.extension
        PRODUCT_NAME: ID3Extension
